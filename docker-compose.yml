# Elvin - autonomous agentic coder. Started by the one-click installer / start scripts.
# Values come from .env (written by the installer). GPU model servers live in
# docker-compose.nvidia.yml / docker-compose.amd.yml; on Apple Silicon (and AMD on
# Windows) Qwen runs in Elvin's own native Ollama, reached via host.docker.internal.
name: elvin

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: elvin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run the installer first}
      POSTGRES_DB: elvin
    volumes:
      - elvin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elvin -d elvin"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - elvin_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  clamav:
    build: ./docker/clamav
    image: elvin-clamav:1.5.4
    volumes:
      - elvin_clamdb:/var/lib/clamav
    networks: [backend, default]   # default network: freshclam downloads virus signatures
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: elvin-runner:1
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?run the installer first}
      RUNNER_CONCURRENCY: "2"
    volumes:
      - elvin_runner_cache:/cache
    tmpfs:
      - /jobs:size=2g,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 1024
    mem_limit: 3g
    cpus: 2
    networks: [sandbox]            # cannot reach the database, Redis or ClamAV
    restart: unless-stopped

  # Local Gemma 3 in Docker: Elvin's automatic fallback when the gateway is down.
  # CPU-only and slower, so Elvin caps effort at "medium" whenever it answers.
  gemma:
    image: ollama/ollama:0.40.15
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - elvin_gemma:/root/.ollama
    mem_limit: ${LOCAL_GEMMA_MEM:-5g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [default]
    restart: unless-stopped

  gemma-pull:   # one-shot: downloads the local fallback models the first time (then exits)
    image: ollama/ollama:0.40.15
    environment:
      OLLAMA_HOST: gemma:11434
      GEMMA_MODEL: ${LOCAL_GEMMA_MODEL:-gemma3:4b}
      QWEN_MODEL: ${LOCAL_QWEN_MODEL:-qwen2.5-coder:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$GEMMA_MODEL\" && ollama pull \"$$QWEN_MODEL\""]
    depends_on:
      gemma: {condition: service_healthy}
    networks: [default]
    restart: "no"

  app:
    build: .
    image: elvin-app:1
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://elvin:${POSTGRES_PASSWORD}@db:5432/elvin
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
      RUNNER_URL: http://runner:9000
      ELVIN_HOME: /elvin
      LOCAL_GEMMA_URL: http://gemma:11434
      LOCAL_GEMMA_MODEL: ${LOCAL_GEMMA_MODEL:-gemma3:4b}
      LOCAL_QWEN_MODEL: ${LOCAL_QWEN_MODEL:-qwen2.5-coder:3b}   # coding fallback in the same Docker Ollama
      LOCAL_GEMMA_THREADS: ${LOCAL_GEMMA_THREADS:-0}   # set by install/start scripts (performance cores)
    user: "${ELVIN_UID:-1000}:${ELVIN_GID:-1000}"
    volumes:
      - ${ELVIN_HOME_HOST:?run the installer first}:/elvin
    ports:
      - "${ELVIN_BIND:-127.0.0.1}:${ELVIN_PORT:-8765}:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      clamav: {condition: service_started}
      runner: {condition: service_started}
      gemma: {condition: service_started}
    networks: [backend, sandbox, default]
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  elvin_pgdata:
  elvin_redisdata:
  elvin_clamdb:
  elvin_runner_cache:
  elvin_gemma:

networks:
  backend:
    internal: true
  sandbox: {}
  default: {}
