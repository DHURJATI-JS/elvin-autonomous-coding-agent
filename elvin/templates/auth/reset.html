{% extends "auth/_layout.html" %}
{% block side_title %}Choose a new password{% endblock %}
{% block form %}
<h2 class="text-2xl font-semibold tracking-tight">New password</h2>
{% if valid %}
<form method="post" action="/reset/{{ token }}" class="mt-6 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div><label class="label" for="password">New password</label><input class="input" id="password" name="password" type="password" required minlength="{{ limits.PASSWORD_MIN }}" maxlength="256" autocomplete="new-password" autofocus></div>
  <div><label class="label" for="confirm">Repeat it</label><input class="input" id="confirm" name="confirm" type="password" required minlength="{{ limits.PASSWORD_MIN }}" maxlength="256" autocomplete="new-password"></div>
  <button class="btn btn-primary w-full" type="submit"><i class="fa-solid fa-check"></i> Save password</button>
  <p class="text-xs muted">Saving signs you out on every device.</p>
</form>
{% else %}
<p class="mt-4 text-sm muted">This reset link is invalid, already used or expired.</p>
<a class="btn btn-primary mt-6 w-full" href="/forgot">Request a new link</a>
{% endif %}
{% endblock %}
